version: 2

project_name: uaanime

builds:
  - main: ./cmd/uaanime
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    # -trimpath: шляхи збірки не залежать від машини (відтворюваність) і не
    # тягнуть у бінарник абсолютні шляхи GOPATH — мінус ~33 КБ.
    flags: [-trimpath]
    ldflags: ["-s", "-w"]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

# Homebrew tap: потребує репозиторію Basmanjacks/homebrew-uaanime
# і токен HOMEBREW_TAP_GITHUB_TOKEN у секретах релізного workflow.
#
# ⚠️ `brews` застарів у GoReleaser v2 (з 2.10) і буде видалений у v3!
# Тримається на піні `version: "~> v2"` у .github/workflows/release.yml.
# Формула потрібна для Linuxbrew, бо cask — лише для macOS.
brews:
  - repository:
      owner: Basmanjacks
      name: homebrew-uaanime
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/Basmanjacks/uaanime
    description: "Дивись аніме українською з термінала"
    caveats: |
      Для відтворення потрібен VLC або mpv.
      Встанови один із них пакетним менеджером системи.
      Перевірка: uaanime doctor
    install: bin.install "uaanime"
    skip_upload: auto

# Cask ставить лише uaanime. VLC/mpv лишаються зовнішніми плеєрами: hard dependency
# конфліктує з VLC.app, установленим вручну й тому невідомим Homebrew.
homebrew_casks:
  - repository:
      owner: Basmanjacks
      name: homebrew-uaanime
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/Basmanjacks/uaanime
    description: "Дивись аніме українською з термінала"
    caveats: |
      Для відтворення потрібен VLC або mpv.
      Встановлення VLC: brew install --cask vlc
      Встановлення mpv: brew install mpv
      Перевірка: uaanime doctor
    binaries:
      - uaanime
    # Бінарник не підписаний і не нотаризований, тож macOS вішає на нього карантин
    # і відмовляється запускати. Знімаємо атрибут одразу після встановлення.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/uaanime"]
          end
    skip_upload: auto
