version: 2

project_name: uaanime

builds:
  - main: ./cmd/uaanime
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags: ["-s", "-w"]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

# Homebrew tap: потребує репозиторію Basmanjacks/homebrew-uaanime
# і токен HOMEBREW_TAP_GITHUB_TOKEN у секретах релізного workflow.
brews:
  - repository:
      owner: Basmanjacks
      name: homebrew-uaanime
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/Basmanjacks/uaanime
    description: "Дивись аніме українською з термінала"
    license: MIT
    dependencies:
      - name: mpv
    skip_upload: auto
