# Реліз на тег v*: GoReleaser збирає бінарники, публікує GitHub Release
# і (за наявності токена) оновлює Homebrew tap.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Мажор GoReleaser закріплений: конфіг написаний під v2 (homebrew_casks),
      # і стрибок на v3 зламав би реліз мовчки. Перевірено локально на v2.18.0.
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
