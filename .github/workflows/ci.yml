# CI: збірка, тести (без мережі — фікстури), лінт. mpv у CI відсутній —
# інтеграційний тест плеєра пропускає себе сам.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test -race ./...
      # Версія закріплена свідомо: `latest` під дією v6 ставив golangci-lint v1.64.8,
      # зібраний з go1.24, і той відмовлявся читати go.mod із `go 1.25.0`.
      # Дія v9 працює лише з golangci-lint v2; тримаємо ту саму версію, що й локально.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
