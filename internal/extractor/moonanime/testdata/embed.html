<style>
	
	
	
	
	
	
	.ma-promo {
		--ma-promo-ease: cubic-bezier(0.34, 1.1, 0.64, 1);
		display: none;
		position: absolute;
		right: clamp(14px, 1.3vw, 40px);
		bottom: var(--ma-promo-bottom, 90px);
		z-index: 16;
		align-items: stretch;
		font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
		opacity: 0;
		transform: translateY(6px);
		pointer-events: none;
		transition: opacity 0.22s var(--ma-promo-ease), transform 0.22s var(--ma-promo-ease);
	}
	
	
	
	.ma-promo--ready { display: flex; }
	.ma-promo--visible {
		opacity: 1;
		transform: translateY(0);
		pointer-events: auto;
	}
	
	
	.ma-promo--floating {
		position: fixed;
		z-index: 9998;
	}

	.ma-promo__link,
	.ma-promo__close {
		background: rgba(20, 22, 29, 0.85);
		border: 1px solid rgba(255, 255, 255, 0.25);
		-webkit-backdrop-filter: blur(8px);
		backdrop-filter: blur(8px);
		transition: background 0.15s var(--ma-promo-ease), border-color 0.15s var(--ma-promo-ease), color 0.15s var(--ma-promo-ease);
	}

	.ma-promo__link {
		display: flex;
		align-items: center;
		gap: 0.55em;
		padding: clamp(7px, 0.58vw, 16px) clamp(11px, 0.95vw, 26px);
		border-radius: 8px 0 0 8px;
		border-right: none;
		color: #e0dff4;
		text-decoration: none;
		font-size: clamp(11px, 0.72vw, 20px);
		font-weight: 600;
	}
	.ma-promo__link:hover,
	.ma-promo__link:focus-visible {
		background: #e50914;
		border-color: #e50914;
		color: #fff;
		outline: none;
	}

	.ma-promo__icon {
		width: 1.25em;
		height: 1.25em;
		flex: 0 0 auto;
		fill: none;
		stroke: currentColor;
		stroke-width: 1.6;
		stroke-linecap: round;
		stroke-linejoin: round;
	}

	.ma-promo__text { display: block; }
	.ma-promo__label {
		display: block;
		white-space: nowrap;
	}
	
	
	
	
	.ma-promo__sub {
		display: block;
		max-width: 21ch;
		font-size: 0.82em;
		font-weight: 500;
		line-height: 1.35;
		color: rgba(224, 223, 244, 0.65);

		max-height: 0;
		overflow: hidden;
		transition: opacity 0.2s var(--ma-promo-ease), max-height 0.25s var(--ma-promo-ease), color 0.15s;
	}
	.ma-promo__link:hover .ma-promo__sub,
	.ma-promo__link:focus-visible .ma-promo__sub {
		opacity: 1;
		max-height: 3em;
		color: rgba(255, 255, 255, 0.85);
	}

		align-items: center;
		justify-content: center;
		width: clamp(24px, 1.85vw, 44px);
		padding: 0;
		border-radius: 0 8px 8px 0;
		border-left: 1px solid rgba(255, 255, 255, 0.14);
		color: rgba(224, 223, 244, 0.55);
		cursor: pointer;
		font: inherit;
	}
	.ma-promo__close:hover,
	.ma-promo__close:focus-visible {
		background: rgba(255, 255, 255, 0.14);
		color: #e0dff4;
		outline: none;
	}
	.ma-promo__close-icon {
		width: clamp(10px, 0.7vw, 18px);
		height: clamp(10px, 0.7vw, 18px);
		fill: none;
		stroke: currentColor;
		stroke-width: 2.2;
		stroke-linecap: round;
		stroke-linejoin: round;
	}

	
	
	@media (max-width: 767px) {
		.ma-promo__sub { display: none; }
		.ma-promo__link { font-size: 12px; padding: 7px 11px; }
		.ma-promo__close { width: 30px; }
	}

	@media (prefers-reduced-motion: reduce) {
		.ma-promo,
		.ma-promo__link,
		.ma-promo__close,
		.ma-promo__sub {
			transition: none;
		}
	}
</style>

<script>
(function () {
	"use strict";

	var promo = document.getElementById("ma-promo");
	if (!promo) return;

	var DISMISS_DAYS = 14;
	var STORE_KEY = "ma:pref:promo_tg_hidden_until";
	var GAP = 16;
	var FALLBACK_BOTTOM = 90;
	var FALLBACK_BOTTOM_MOBILE = 70;
	
	
	var OWN_HOSTS = ["moonanime.vip", "moonanime.art"];

	function remove() {
		if (promo.parentNode) promo.parentNode.removeChild(promo);
	}

	
	
	
	
	function readHiddenUntil() {
		try {
			return parseInt(window.localStorage.getItem(STORE_KEY), 10) || 0;
		} catch (e) {
			return 0;
		}
	}
	function writeHiddenUntil(ts) {
		try {
			window.localStorage.setItem(STORE_KEY, String(ts));
		} catch (e) {
			
		}
	}

	
	function parentHost() {
		if (window.self === window.top) return window.location.hostname;
		try {
			return window.top.location.hostname;
		} catch (e) {
			
			if (!document.referrer) return "";
			try {
				return new URL(document.referrer).hostname;
			} catch (e2) {
				return "";
			}
		}
	}

	var host = (parentHost() || "").replace(/^www\./i, "").toLowerCase();
	for (var i = 0; i < OWN_HOSTS.length; i++) {
		if (host === OWN_HOSTS[i] || host.slice(-(OWN_HOSTS[i].length + 1)) === "." + OWN_HOSTS[i]) {
			remove();
			return;
		}
	}
	if (Date.now() < readHiddenUntil()) {
		remove();
		return;
	}

	
	
	
	
	var MOUNTS = [
		{ sel: "#ma-player-wrap", slot: null },   
		{ sel: ".ma-wrap", slot: null },          
		{ sel: "#mp-root", slot: "middle-chrome" },
		{ sel: "#ma-plain-wrap", slot: null }     
	];

	var mount = null;
	for (var m = 0; m < MOUNTS.length; m++) {
		var node = document.querySelector(MOUNTS[m].sel);
		if (node) {
			mount = MOUNTS[m];
			mount.node = node;
			break;
		}
	}

	if (mount) {
		
		
		
		
		if (mount.slot) promo.setAttribute("slot", mount.slot);
		mount.node.appendChild(promo);
	} else {
		document.body.appendChild(promo);
		promo.classList.add("ma-promo--floating");
	}

	
	
	
	
	
	var BARS = [".plyr__controls", "media-control-bar", "media-controls", ".vds-controls"];

	function measure() {
		var barRect = null;
		for (var b = 0; b < BARS.length; b++) {
			var bar = document.querySelector(BARS[b]);
			if (bar) {
				var rect = bar.getBoundingClientRect();
				if (rect.height > 0) {
					barRect = rect;
					break;
				}
			}
		}

		var bottom;
		if (barRect) {
			
			
			
			
			
			
			var hostBottom = promo.classList.contains("ma-promo--floating")
				? window.innerHeight
				: (promo.offsetParent || document.documentElement).getBoundingClientRect().bottom;
			bottom = hostBottom - barRect.top + GAP;
		}
		
		
		
		if (!(bottom > 0)) {
			bottom = window.innerWidth <= 767 ? FALLBACK_BOTTOM_MOBILE : FALLBACK_BOTTOM;
		}
		promo.style.setProperty("--ma-promo-bottom", Math.round(bottom) + "px");
	}

	
	
	function controlsVisible() {
		var plyr = document.querySelector(".plyr");
		if (plyr) {
			return plyr.classList.contains("plyr--paused") || !plyr.classList.contains("plyr--hide-controls");
		}
		var mc = document.querySelector("media-controller");
		if (mc) {
			return mc.hasAttribute("mediapaused") || !mc.hasAttribute("userinactive");
		}
		var vds = document.querySelector("[data-media-player]");
		if (vds) {
			return vds.hasAttribute("data-paused") || vds.hasAttribute("data-controls");
		}
		return null;
	}

	
	
	
	
	var RIVALS = ".ma-skip-btn--visible, .ma-playlist-next-card--visible, .ma-skip-container:not(.ma-skip-hidden)";

	var playing = false;
	var scheduled = false;

	function update() {
		scheduled = false;
		if (!promo.parentNode) return;
		var cv = controlsVisible();
		
		
		var show = !document.querySelector(RIVALS) && (!playing || cv === true);
		promo.classList.toggle("ma-promo--visible", show);
		if (show) measure();
	}

	function schedule() {
		if (scheduled) return;
		scheduled = true;
		window.requestAnimationFrame(update);
	}

	function setPlaying(next) {
		playing = next;
		schedule();
	}

	window.addEventListener("ma-player-state", function (e) {
		if (!e || !e.detail || typeof e.detail.playing !== "boolean") return;
		setPlaying(e.detail.playing);
	});
	
	
	
	document.addEventListener("play", function (e) {
		if (e.target && e.target.tagName === "VIDEO") setPlaying(true);
	}, true);
	document.addEventListener("pause", function (e) {
		if (e.target && e.target.tagName === "VIDEO") setPlaying(false);
	}, true);
	document.addEventListener("ended", function (e) {
		if (e.target && e.target.tagName === "VIDEO") setPlaying(false);
	}, true);

	var observerTarget = (mount && mount.node) || document.body;
	new MutationObserver(schedule).observe(observerTarget, {
		attributes: true,
		attributeFilter: ["class", "userinactive", "mediapaused", "data-controls", "data-paused"],
		subtree: true,
		childList: true
	});

	window.addEventListener("resize", schedule);
	document.addEventListener("fullscreenchange", schedule);

	document.getElementById("ma-promo-close").addEventListener("click", function () {
		writeHiddenUntil(Date.now() + DISMISS_DAYS * 86400000);
		promo.classList.remove("ma-promo--visible");
		window.setTimeout(remove, 250);
	});

	promo.classList.add("ma-promo--ready");
	measure();
	schedule();
})();
</script>



		
	</body>
</html>
