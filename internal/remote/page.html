<!doctype html>
<html lang="uk">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b0f">
<title>{{.Title}}</title>
<style>
:root { color-scheme: dark light; --accent: #d97757; --on-accent: #0b0b0f; --bg: #0b0b0f; --fg: #e8e8ea; --dim: #8b8b94; --panel: #1a1a21 }
@media (prefers-color-scheme: light) {
 :root { --accent: #a94324; --on-accent: #fff; --bg: #faf8f4; --fg: #252321; --dim: #69635c; --panel: #ebe6de; color-scheme: light }
}
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px }
#connection { color: var(--accent); min-height: 20px; font-size: 13px }
#session, #seek { width: 100%; accent-color: var(--accent) }
#session { font: inherit; padding: 12px; border: 1px solid var(--dim); border-radius: 10px; background: var(--panel); color: var(--fg) }
#sessionhint, #remaining { margin: 0; font-size: 13px; color: var(--dim) }
#seek { min-height: 44px; margin: 0 }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap }
* { box-sizing: border-box }
html { height: 100% }
body {
  margin: 0; min-height: 100%; background: var(--bg); color: var(--fg);
  font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  display: flex; flex-direction: column; gap: 10px;
  padding: calc(env(safe-area-inset-top) + 16px) calc(env(safe-area-inset-right) + 16px)
           calc(env(safe-area-inset-bottom) + 16px) calc(env(safe-area-inset-left) + 16px);
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
}
h1 { margin: 0; font-size: 20px; font-weight: 600; overflow-wrap: anywhere }
#ep { color: var(--dim); font-size: 14px; min-height: 20px; overflow-wrap: anywhere }
#meta { display: flex; justify-content: space-between; align-items: baseline; gap: 10px }
#time, #vol { color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums }
#vol { white-space: nowrap }
/* Смуга тонка, а палець ні: клікабельна зона — обгортка з полями. */
#seek { padding: 0 }
button {
  font: inherit; font-size: 17px; font-weight: 600; color: var(--fg);
  background: var(--panel); border: 0; border-radius: 14px; padding: 18px; width: 100%;
}
button:disabled { opacity: .35 }
button:active:enabled { filter: brightness(1.35) }
#pause { height: 24vh; min-height: 96px; font-size: 26px; background: var(--accent); color: var(--on-accent) }
.row { display: flex; gap: 10px }
/* Чотири кроки перемотки мусять влізти в 320 пікселів ширини. */
.seekrow button { padding: 16px 2px; font-size: 15px }
.volrow button { flex: 0 0 84px; font-size: 22px; padding: 16px 0 }
#vollabel {
  flex: 1; display: flex; align-items: center; justify-content: center;
  background: var(--panel); border-radius: 14px; color: var(--dim);
}
#stopafter.on { color: var(--accent) }
#stop { background: none; color: var(--dim); font-weight: 400; font-size: 15px; padding: 12px; flex: 0 0 40% }
#eps { display: flex; flex-direction: column; gap: 6px }
#eps[hidden] { display: none }
#eps button { display: flex; justify-content: space-between; gap: 10px; font-size: 16px; font-weight: 400; padding: 16px }
#eps button.current { color: var(--accent); font-weight: 600 }
#eps .pos { color: var(--dim); font-size: 14px; font-variant-numeric: tabular-nums }
#eps .note { color: var(--dim); font-size: 14px; padding: 16px 2px }
#labels { display: none }
</style>
<h1 id="title">{{.Idle}}</h1>
<div id="ep"></div>
<div id="connection" role="status" aria-live="polite">{{.Reconnecting}}</div>
<div id="meta"><span id="time">00:00 / 00:00</span><span id="vol"></span></div>
<label class="sr-only" for="seek">{{.Seek}}</label>
<input id="seek" type="range" min="0" max="0" value="0" step="1" disabled>
<button id="pause" aria-pressed="false" disabled>{{.Pause}}</button>
<div class="row seekrow">
  <button id="back30" disabled>{{.Back30}}</button>
  <button id="back" disabled>{{.Back}}</button>
  <button id="forward" disabled>{{.Forward}}</button>
  <button id="forward30" disabled>{{.Forward30}}</button>
</div>
<div class="row volrow">
  <button id="voldown" aria-label="{{.VolumeDown}}" disabled>−</button>
  <span id="vollabel">{{.Volume}}</span>
  <button id="volup" aria-label="{{.VolumeUp}}" disabled>+</button>
</div>
<button id="next" disabled>{{.Next}}</button>
<button id="stopafter" aria-pressed="false" disabled>{{.StopAfter}}</button>
<label for="session">{{.Session}}</label>
<select id="session" aria-describedby="sessionhint remaining" disabled><option value="0">{{.SessionOff}}</option>{{range .SessionOptions}}<option value="{{.}}">{{.}}</option>{{end}}</select>
<p id="remaining" aria-live="polite"></p>
<p id="sessionhint">{{.SessionHint}}</p>
<div class="row">
  <button id="epsbtn" aria-expanded="false" aria-controls="eps" disabled>{{.Episodes}} ▾</button>
  <button id="stop" disabled>{{.Stop}}</button>
</div>
<div id="eps" hidden></div>
<div id="labels"><span id="l-idle">{{.Idle}}</span><span id="l-episode">{{.Episode}}</span><span id="l-play">{{.Play}}</span><span id="l-pause">{{.Pause}}</span><span id="l-vol">{{.VolumeFmt}}</span><span id="l-stopafter">{{.StopAfter}}</span><span id="l-episodes">{{.Episodes}}</span><span id="l-noplaylist">{{.NoPlaylist}}</span><span id="l-remaining">{{.SessionRemaining}}</span><span id="l-reconnecting">{{.Reconnecting}}</span><span id="l-offline">{{.Offline}}</span></div>
<script>
const BASE = {{.Base}};
const CMDS = ["pause", "back", "forward", "back30", "forward30", "voldown", "volup", "next", "stopafter", "stop"];
const $ = (id) => document.getElementById(id);
const L = (k) => $("l-" + k).textContent;
// Команда й опитування не блокують одна одну: статус на боці VLC може
// думати секунди, а тап по «Пауза» у цей час губитися не має. Дві команди
// поспіль — інша річ: друга чекає, поки кнопки знову ввімкнуться.
let busy = false;
let connected = false;
let dragging = false;
let live = false;
let dur = 0;
let timer = 0;
let polling = false;
let pollAgain = false;
let commandGen = 0;
// Покоління показаного списку серій. −1 — списку ще не тягнули: нуль зайнятий
// станом «плейлиста немає», і з ним сторінка не помітила б першої публікації.
let epsGen = -1;
let epsOpen = false;
let epsBusy = false;

function mmss(v) {
  const s = Math.max(0, Math.round(Number(v) || 0));
  const m = Math.floor(s / 60);
  return String(m).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
}
function enable(on) {
  $("epsbtn").disabled = busy || !connected;
  $("session").disabled = !on || busy || !connected;
  $("seek").disabled = !on || busy || !connected || dur <= 0;
  for (const id of CMDS) { $(id).disabled = !on || busy || !connected; }
  for (const row of $("eps").children) {
    if (row.tagName === "BUTTON") { row.disabled = busy || !connected; }
  }
}
function connection(on) {
 connected = on;
 $("connection").textContent = on ? "" : L("reconnecting");
 enable(live);
}
function stopAfter(on) {
  $("stopafter").setAttribute("aria-pressed", String(on));
  $("stopafter").classList.toggle("on", on);
  $("stopafter").textContent = on ? L("stopafter") + " ●" : L("stopafter");
}
function idle() {
  live = false;
  dur = 0;
  $("title").textContent = L("idle");
  $("ep").textContent = "";
  $("time").textContent = "00:00 / 00:00";
  $("vol").textContent = "";
  $("seek").max = "0"; $("seek").value = "0"; dragging = false;
  $("session").value = "0"; $("remaining").textContent = "";
  $("pause").setAttribute("aria-pressed", "false");
  $("pause").textContent = L("play");
  stopAfter(false);
  enable(false);
}
function render(st) {
  if (!st) { return; }
  syncEps(st);
  if (!st.playing) { idle(); return; }
  live = true;
  const p = Number(st.position_sec) || 0;
  dur = Number(st.duration_sec) || 0;
  const v = Number(st.volume_pct);
  $("title").textContent = st.title || L("idle");
  $("ep").textContent = L("episode").replace("%d", st.episode) + (st.studio ? " · " + st.studio : "");
  $("time").textContent = mmss(p) + " / " + mmss(dur);
  // Гучності може не бути зовсім (плеєр мовчить) — тоді рядок порожній, бо
  // нуль тут читався б як «звук вимкнено».
  $("vol").textContent = v >= 0 ? L("vol").replace("%d", Math.round(v)) : "";
  if (!dragging) { $("seek").max = String(Math.max(0,dur)); $("seek").value = String(Math.min(dur,Math.max(0,p))); }
  $("seek").setAttribute("aria-valuetext", mmss($("seek").value) + " / " + mmss(dur));
  $("pause").setAttribute("aria-pressed", String(!!st.paused));
  $("session").value = String(st.session_limited ? st.session_remaining : 0);
  $("remaining").textContent = st.session_limited ? L("remaining").replace("%d", st.session_remaining) : "";
  $("pause").textContent = st.paused ? L("play") : L("pause");
  stopAfter(!!st.stop_after);
  enable(true);
}
// Список стежить за поколінням, а не за номером серії: поза відтворенням серія
// нульова, а список у застосунку вже може бути іншим.
function syncEps(st) {
  const gen = Number(st.playlist_gen) || 0;
  if (epsOpen && gen !== epsGen) { loadEps(); }
}
async function loadEps() {
  if (epsBusy || !connected) { return; }
  epsBusy = true;
  const gen = commandGen;
  try {
    const r = await fetch(BASE + "episodes");
    if (gen !== commandGen) { return; }
    if (!r.ok) { connection(false); return; }
    const pl = await r.json();
    if (gen !== commandGen) { return; }
    epsGen = Number(pl.gen) || 0;
    drawEps(pl.episodes || []);
  } catch (e) {
    if (gen === commandGen) { epsGen = -1; connection(false); }
  } finally {
    epsBusy = false;
  }
}
function drawEps(list) {
  const box = $("eps");
  while (box.firstChild) { box.removeChild(box.firstChild); }
  if (list.length === 0) {
    const note = document.createElement("div");
    note.className = "note";
    note.textContent = L("noplaylist");
    box.appendChild(note);
    return;
  }
  for (const e of list) {
    const n = Number(e.number) || 0;
    const sec = Number(e.position_sec) || 0;
    const row = document.createElement("button");
    row.disabled = busy || !connected;
    const name = document.createElement("span");
    const pos = document.createElement("span");
    row.className = e.current ? "current" : "";
    name.textContent = (e.current ? "▶" : (e.watched ? "✓" : "·")) + " " + L("episode").replace("%d", n);
    pos.className = "pos";
    pos.textContent = sec > 0 ? mmss(sec) : "";
    row.appendChild(name);
    row.appendChild(pos);
    // Покоління йде разом із номером: сервер інакше не відрізнить тап по цьому
    // списку від тапу по списку, який застарів ще до дотику.
    row.addEventListener("click", () => call("play/" + epsGen + "/" + n, "POST"));
    box.appendChild(row);
  }
}
function toggleEps() {
  if (!connected || busy) { return; }
  epsOpen = !epsOpen;
  $("eps").hidden = !epsOpen;
  $("epsbtn").setAttribute("aria-expanded", String(epsOpen));
  $("epsbtn").textContent = L("episodes") + (epsOpen ? " ▴" : " ▾");
  if (epsOpen) { loadEps(); }
}
async function call(path, method) {
  const command = method === "POST";
  if (command) {
    if (busy || !connected) { return; }
    busy = true;
    commandGen++;
    enable(false);
  }
  const gen = commandGen;
  try {
    const r = await fetch(BASE + path, { method: method });
    if (gen !== commandGen) { return; }
    if (r.status === 409) {
      const body = await r.json().catch(() => null);
      if (gen !== commandGen) { return; }
      $("ep").textContent = body && body.error ? body.error : "";
      // Застарілий список — не привід гасити пульт: перечитуємо серії й лишаємо
      // кнопки як були.
      if (path.indexOf("play/") === 0) { loadEps(); enable(live); return; }
      idle();
      return;
    }
    const st = await r.json();
    if (gen !== commandGen) { return; }
    if (!r.ok) { connection(false); return; }
    if (!command && path === "status") { connection(true); }
    render(st);
  } catch (e) {
    if (gen !== commandGen) { return; }
    connection(false);
  } finally {
    if (command) {
      busy = false;
      enable(live);
      pollAgain = true;
      poll();
    }
  }
}
async function poll() {
  clearTimeout(timer);
  if (document.hidden || polling || busy) { return; }
  pollAgain = false;
  polling = true;
  await call("status", "GET");
  polling = false;
  if (pollAgain) { poll(); return; }
  if (!document.hidden) { timer = setTimeout(poll, 2000); }
}
for (const id of CMDS) {
  $(id).addEventListener("click", () => call(id, "POST"));
}
$("epsbtn").addEventListener("click", toggleEps);
$("session").addEventListener("change", () => call("session/" + $("session").value, "POST"));
$("seek").addEventListener("input", () => {
  dragging = true;
  $("seek").setAttribute("aria-valuetext", mmss($("seek").value) + " / " + mmss(dur));
});
$("seek").addEventListener("change", () => {
  dragging = false;
  if (!live || dur <= 0 || busy || !connected) { return; }
  call("seek/" + Math.round(Number($("seek").value)), "POST");
});
$("seek").addEventListener("pointercancel", () => { dragging = false; });
document.addEventListener("visibilitychange", () => { if (!document.hidden) { poll(); } });
idle();
poll();
</script>
